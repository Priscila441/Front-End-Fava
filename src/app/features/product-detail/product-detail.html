<div class="max-w-6xl mx-auto mt-[40px] p-6 flex flex-col md:flex-row gap-10 bg-white shadow-lg rounded-lg">
  <!-- Imagen del producto -->
  <div class="md:w-1/2 flex justify-center items-center">
    <img [src]="product?.imagesUrl" 
         alt="{{ product?.nameProduct }}" 
         class="w-full max-w-md rounded-lg shadow-md object-cover" />
  </div>

  <!-- Información del producto -->
  <div class="md:w-1/2 flex flex-col justify-between gap-6">
    <div>
      <h1 class="text-3xl font-bold text-gray-800">{{ product?.nameProduct }}</h1>
      <p class="text-gray-500 mt-2">{{ product?.description }}</p>
      <p class="text-xl font-semibold text-blue-600 mt-4">${{ product?.price }}</p>
      <p class="mt-2" 
         [ngClass]="product?.stateProduct === 'Available' ? 'text-green-600' : 'text-red-600'">
         {{ product?.stateProduct === 'Available' ? 'En stock' : 'Agotado' }}
      </p>
    </div>

    <!-- Selección de cantidad y botones -->
    <div class="flex flex-col gap-4 mt-4">
      <div class="flex items-center gap-2">
        <label for="quantity" class="font-medium">Cantidad:</label>
        <input type="number" id="quantity" [(ngModel)]="quantity"
               min="1" [max]="product?.stock ?? 1"
               class="border rounded p-1 w-20 text-center" />
      </div>

      <div class="flex gap-4">
        <button (click)="addToCart(product?.idProduct!)"
                [disabled]="product?.stateProduct !== 'Available'"
                class="flex-1 bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition duration-200">
          Agregar al carrito
        </button>
        <button (click)="goBack()"
                class="flex-1 bg-gray-200 text-gray-700 py-2 rounded hover:bg-gray-300 transition duration-200">
          Volver al Home
        </button>
      </div>
    </div>
  </div>
</div>
